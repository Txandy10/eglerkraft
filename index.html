<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Text Viewer</title>
    <style>
        /* Force the website layout to fill the entire browser window */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212; /* Dark background */
            color: #e0e0e0;            /* Light readable text */
            font-family: monospace;    /* Clean look for text files */
            overflow: hidden;          /* Removes default browser bars */
        }

        /* Fullscreen scrollable text box */
        #text-container {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            white-space: pre-wrap;     /* Keeps spaces and wraps words */
            word-wrap: break-word;
            overflow-y: auto;          /* Scrollbar appears only if text overflows */
            font-size: 16px;
            line-height: 1.5;
        }

        /* Centered loading message styling */
        .status-msg {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="text-container">
        <div class="status-msg">Loading large text file...</div>
    </div>

    <script>
        // 1. PASTE YOUR COPIED GITHUB LINK INSIDE THE QUOTES BELOW
        const rawGithubLink = "https://github.com/Txandy10/eglerkraft/releases/download/indere/NB2HI4DTHIXS6Y3ENYXGKYLHNRSXEY3SMFTHILTOMV2C633CNJSWG5DTF5SGYLZSGYXDEL3FMFTWYZLSMNZGCZTUFUZDMLRSFV5GK5LTFVZWW2LOOMXGQ5DNNQ";

        // 2. We attach corsproxy.io to the front to bypass browser CORS blocks
       

        async function fetchFullscreenText() {
            const container = document.getElementById("text-container");
            try {
                const response = await fetch(rawGithubLink);
                if (!response.ok) throw new Error("Could not load file from GitHub.");

                const largeText = await response.text();
                
                // Put the raw text directly into the fullscreen box
                container.innerText = largeText;

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">Error: ${error.message}</div>`;
            }
        }

        // Run automatically when the webpage opens
        window.onload = fetchFullscreenText;
    </script>
</body>
</html>
