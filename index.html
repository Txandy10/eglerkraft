<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen App Loader</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        #loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="status-text">Assembling application files (0/3)...</div>
    </div>

    <!-- Secure sandboxed frame container -->
    <iframe id="content-frame" sandbox="allow-scripts allow-forms"></iframe>

    <script>
        // Updated to strictly reference your 3 file fragments
        const fileParts = [
            "part_1.txt",
            "part_2.txt",
            "part_3.txt"
        ];

        async function chunkLoaderAssembly() {
            const loadingScreen = document.getElementById("loading-screen");
            const statusText = document.getElementById("status-text");
            const iframe = document.getElementById("content-frame");

            try {
                statusText.innerText = "Streaming component partitions...";
                
                // Fetch all 3 parts from Vercel's fast local deployment path
                const fetchPromises = fileParts.map(part => 
                    fetch(part).then(res => {
                        if (!res.ok) throw new Error(`Failed to load: ${part}`);
                        return res.text();
                    })
                );

                statusText.innerText = "Stitching core systems together...";
                const textChunks = await Promise.all(fetchPromises);
                
                // Combine the 3 parts back into the single large document string
                const completeHtmlContent = textChunks.join("");

                // Inject the unified data string directly into the secure execution frame
                iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(completeHtmlContent);

                loadingScreen.style.display = "none";
                iframe.style.display = "block";

            } catch (error) {
                console.error("Assembly System Error:", error);
                statusText.style.color = "#ff4d4d";
                statusText.innerText = `Error: ${error.message}`;
                const spinner = document.querySelector(".spinner");
                if (spinner) spinner.style.display = "none";
            }
        }

        window.addEventListener("DOMContentLoaded", chunkLoaderAssembly);
    </script>
</body>
</html>
