<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen App Loader</title>
    <style>
        /* Make the browser window completely edge-to-edge */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Fullscreen container for your file's HTML */
        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* Loading screen layout */
        #loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="status-text">Loading site files directly from GitHub...</div>
    </div>

    <!-- This frame will hold and execute your HTML code full screen -->
    <iframe id="content-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <script>
        // Updated to use the correct release asset storage domain to bypass browser blocks
        const directFileUrl = "https://release-assets.githubusercontent.com/Txandy10/eglerkraft/releases/download/indere/NB2HI4DTHIXS6Y3ENYXGKYLHNRSXEY3SMFTHILTOMV2C633CNJSWG5DTF5SGYLZSGYXDEL3FMFTWYZLSMNZGCZTUFUZDMLRSFV5GK5LTFVZWW2LOOMXGQ5DNNQ";

        async function loadWebsite() {
            const loadingScreen = document.getElementById("loading-screen");
            const statusText = document.getElementById("status-text");
            const iframe = document.getElementById("content-frame");

            try {
                // Fetch directly from the raw GitHub storage server
                const response = await fetch(directFileUrl);
                if (!response.ok) throw new Error(`Failed to stream file (${response.status})`);

                const rawHtmlContent = await response.text();

                // Inject the raw text directly into the fullscreen frame to run it
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(rawHtmlContent);
                iframeDoc.close();

                // Hide loading screen and display the running page
                loadingScreen.style.display = "none";
                iframe.style.display = "block";

            } catch (error) {
                console.error("Loader Error:", error);
                statusText.style.color = "#ff4d4d";
                statusText.innerText = `Error loading file: ${error.message}`;
                const spinner = document.querySelector(".spinner");
                if (spinner) spinner.style.display = "none";
            }
        }

        window.addEventListener("DOMContentLoaded", loadWebsite);
    </script>
</body>
</html>
